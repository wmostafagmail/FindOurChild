name: Foundation and synthetic qualification required validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1a-required:
    runs-on: ubuntu-24.04
    # Full 360-browser /746-Python serial regression; timeout never implies success.
    timeout-minutes: 150
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      FOC_E2E_DATA_CLASS: synthetic
      FOC_E2E_ISOLATED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.0
          enable-cache: false
      - name: Locked dependencies
        run: |
          test "$(npm --version)" = '11.16.0'
          uv sync --locked
          npm ci --ignore-scripts
      - name: Contracts and preserved evidence
        run: |
          .venv/bin/ruff check services/api scripts tests
          .venv/bin/python -m scripts.check_foundation
      - name: Private database and migrations
        run: |
          mkdir -p artifacts/raw
          .venv/bin/python -m scripts.dev init
          .venv/bin/python -m scripts.dev db > artifacts/raw/provision.log 2>&1
          .venv/bin/python -m scripts.dev api
      - name: Python API database security regression
        run: .venv/bin/python -m scripts.dev test
      - name: Reporting PostgreSQL media and safeguarding regression
        run: .venv/bin/python -m scripts.reporting_validate
      - name: Synthetic research API database and adversarial regression
        run: .venv/bin/python -m scripts.research_validate
      - name: Isolated qualification preparation and recovery
        run: .venv/bin/python -m scripts.qualification_validate
      - name: Synthetic investigation PostgreSQL and adversarial regression
        run: .venv/bin/python -m scripts.workflow_validate
      - name: Synthetic investigation backup and restore
        run: .venv/bin/python -m scripts.recovery
      - name: Dependency security audit
        run: .venv/bin/python -m scripts.audit
      - name: Web types and build
        run: |
          npm run typecheck
          npm run build
      - name: Configure bounded Ubuntu package downloads
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          sudo python3 - <<'PYAPT'
          from pathlib import Path
          for name in ["/etc/apt/sources.list", "/etc/apt/sources.list.d/ubuntu.sources"]:
              path = Path(name)
              if not path.exists():
                  continue
              original = path.read_text()
              updated = original.replace("http://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu").replace("https://azure.archive.ubuntu.com/ubuntu", "https://archive.ubuntu.com/ubuntu")
              if updated != original:
                  path.write_text(updated)
          Path("/etc/apt/apt.conf.d/99foc-ci-network").write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n')
          print("Ubuntu primary archive configured; suites, components and signing keys retained")
          PYAPT
      - name: Install pinned browser engines
        run: ./node_modules/.bin/e2e-web install chromium firefox webkit --with-deps
      - name: Configure ephemeral runner TLS trust
        run: |
          .venv/bin/python -m scripts.tls_setup
          openssl verify -x509_strict -CAfile .runtime/tls/cert.pem .runtime/tls/server.pem
          sudo cp .runtime/tls/cert.pem /usr/local/share/ca-certificates/foc-synthetic.crt
          sudo update-ca-certificates
          sudo apt-get update -qq
          sudo apt-get install -y libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n foc-synthetic -t 'C,,' -i .runtime/tls/cert.pem
          node scripts/ci_tls_policy.mjs
      - name: Start actual web service
        run: |
          npm run start > artifacts/raw/web.log 2>&1 &
          PATH="$PATH" node scripts/tls.mjs > artifacts/raw/tls.log 2>&1 &
          .venv/bin/python -m scripts.wait_services
      - name: TesterArmy browser regression
        run: .venv/bin/python -m scripts.dev browser
      - name: Real Keycloak identity and authorization regression
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m scripts.identity_test
      - name: Real reporting BFF API and worker regression
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m scripts.reporting_http_test
      - name: Real research capability API regression
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m scripts.research_test research_http
      - name: Real synthetic investigation BFF and authorization regression
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m scripts.workflow_test synthetic_workflow_http
      - name: Collect API-process and combined regression coverage
        if: ${{ !cancelled() }}
        run: .venv/bin/python -m scripts.coverage_finish
      - name: Sanitize and enforce complete results
        if: always()
        run: .venv/bin/python -m scripts.artifacts
      - name: Publish only sanitized evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase1a-sanitized-${{ github.sha }}
          path: artifacts/sanitized/
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable services
        if: always()
        run: .venv/bin/python -m scripts.dev stop
