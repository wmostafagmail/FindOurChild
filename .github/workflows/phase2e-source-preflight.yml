name: Phase 2E source prototype validation
on:
  pull_request:
  push:
    branches: [main, 'codex/phase-2e-licensed-recognition', 'codex/phase-2e-demo-governance']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase2e-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.0
          enable-cache: false
      - name: Preserve exact existing dependency lock
        run: uv sync --locked
      - name: E0 integrity and independent-approval negatives
        run: |
          .venv/bin/ruff check tools/phase2e services/demo_recognition tests/phase2e
          .venv/bin/python -m tools.phase2e.test_controls
      - name: Audit exact source-only build dependency versions
        run: .venv/bin/python -m pip_audit --no-deps --disable-pip -r services/demo_recognition/requirements-build.txt --format json --output artifacts/phase2e-e0-controls/dependency-audit.json
      - name: Native closed interface and synthetic contracts (not A1b approval)
        run: .venv/bin/python -m tools.phase2e.qualify "$RUNNER_TEMP/foc-phase2e-source"
      - name: Publish data-free qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase2e-source-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/foc-phase2e-source/sanitized/
            artifacts/phase2e-e0-controls/
            ${{ runner.temp }}/foc-phase2e-source/raw/
          if-no-files-found: error
          retention-days: 7
